name: Atualiza o perfil

on:
  schedule:
    - cron: '23 9 * * *' # todo dia, 06:23 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/perfil.yml'

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gera as imagens
        run: node scripts/gerar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salva se mudou
        run: |
          git add assets/gerado
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: atualiza imagens do perfil"
          git push

<svg xmlns="http://www.w3.org/2000/svg" width="410" height="240" viewBox="0 0 410 240" role="img" aria-label="Estatísticas no GitHub">

<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 16px; font-weight: 600; }
  .label { font-size: 13px; }
  .value { font-size: 13px; font-weight: 600; }
  .small { font-size: 11px; }
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .grid { stroke: #d0d7de; }
  .track { fill: #eff2f5; }
  .bar { fill: #0969da; }
  text { fill: #1f2328; }
  .title { fill: #0969da; }
  .label, .small { fill: #59636e; }
  .value { fill: #1f2328; }
  @media (prefers-color-scheme: dark) {
  .bg { fill: #0d1117; stroke: #30363d; }
  .grid { stroke: #30363d; }
  .track { fill: #21262d; }
  .bar { fill: #2f81f7; }
  text { fill: #e6edf3; }
  .title { fill: #58a6ff; }
  .label, .small { fill: #9198a1; }
  .value { fill: #e6edf3; }
  }
</style>
<rect x="0.5" y="0.5" width="409" height="239" rx="6" class="bg"/>
<text x="20" y="32" class="title">Estatísticas no GitHub</text>
<text x="20" y="64" class="label">Contribuições (12 meses)</text><text x="390" y="64" class="value" text-anchor="end">314</text>
<text x="20" y="86" class="label">Commits (12 meses)</text><text x="390" y="86" class="value" text-anchor="end">282</text>
<text x="20" y="108" class="label">Pull requests</text><text x="390" y="108" class="value" text-anchor="end">21</text>
<text x="20" y="130" class="label">Issues</text><text x="390" y="130" class="value" text-anchor="end">0</text>
<text x="20" y="152" class="label">Repositórios públicos</text><text x="390" y="152" class="value" text-anchor="end">10</text>
<text x="20" y="174" class="label">Estrelas recebidas</text><text x="390" y="174" class="value" text-anchor="end">1</text>
<text x="20" y="196" class="label">Sequência atual</text><text x="390" y="196" class="value" text-anchor="end">1 dia</text>
<text x="20" y="218" class="label">Maior sequência</text><text x="390" y="218" class="value" text-anchor="end">13 dias</text>
</svg>
